<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貸し借りメモ</title>
    <link rel="stylesheet" href="kashikari.css">
</head>
<body>

    <div class="contaier">
        <h1>貸し借りメモ</h1>

        <!--入力-->
        <form id="memo-form" class="card">
            <div class="form-group">
                <label for="type">区分</label>
                <select id="type" required>
                    <option value="lend">貸した(+)</option>
                    <option value="borrow">借りた(-)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">相手の名前</label>
                <input type="text" id="name" placeholder="例：　たろう" required>
            </div>

            <div class="form-group">
                <label for="amount">金額(円)</label>
                <input type="number" id="amount" placeholder="例：　1000" min="0" step="10" required>
            </div>

            <div class="form-group">
                <label for="メモ">メモ(任意)</label>
                <input type="text" id="memo" placeholder="例：　ランチ代">
            </div>

            <button type="submit" id="add-btn">登録する</button>
        </form>

        <!--合計表示-->
        <div class="summary card">
            <div class="summary-item">
                <span>貸している合計：</span>
                <span id="total-lend" class="text-lend">¥0</span>
            </div>
            <div class="summary-item">
                <span>借りている合計：</span>
                <span id="total-borrow" class="text-borrow">¥0</span>
            </div>
        </div>

        <!--リスト表示-->
        <div class="list-section">
            <h2>一覧</h2>
            <ul id="memo-list" class="memo-list">
            </ul>
        </div>
    </div>

    <script src="kashikari.js"></script>
</body>
</html>
